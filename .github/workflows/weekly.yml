name: 每周更新

on:
  schedule:
    # 每周一 09:00（北京时间，UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: '覆盖本周已经生成的数据'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 采集本周素材
        id: collect
        continue-on-error: true
        env:
          BILI_COOKIE: ${{ secrets.BILI_COOKIE }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          node scripts/collect.mjs $ARGS

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js collection-report.json preview.png
          if git diff --cached --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "chore: 每周素材更新 $(date +'%Y-%m-%d')"
            git push
          fi

      - name: 准备静态站点
        run: |
          mkdir -p _site
          cp index.html app.js data.js favicon.svg _site/
          cp preview.png _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 采集失败时标记
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::warning::本周采集失败，已保留上一期数据并完成部署。请查看 collection-report.json。"
          exit 1
